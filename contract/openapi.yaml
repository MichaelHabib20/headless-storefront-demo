openapi: 3.0.3
info:
  title: SuperCommerce Storefront API
  version: 3.0.0
  description: |
    Headless storefront API (v3). The backend owns business logic (prices, links,
    visibility, what to show); storefronts own the UI.

    Rules:
    - Localized by `?locale=` or `Accept-Language` (`en` | `ar`). All text comes back in that language.
    - Success: `{"data": ...}` with HTTP 200. Failure: `{"error": {"code", "message"}}` with a real HTTP status.
    - Everything clickable carries a `Target`. Storefronts map targets to their own URLs.
    - Within v3, changes are additive only. Storefronts must ignore unknown fields and skip unknown `Target.type` / `layout` values.

    Shopper session:
    - Personal endpoints (cart, wishlist, compare, notifications) need `Authorization: Bearer <token>`.
      The token belongs to a signed-in customer or to a guest.
    - A guest token is created ONLY by `POST /session/guest` (no GET ever creates data). Storefronts
      create one the first time a visitor without a token adds something.
    - `GET /me` works without a token (all counts 0) so the header can render for every visitor.
    - Signing in with a guest token merges the guest's cart, wishlist and compare into the customer (existing behavior).
    - GET requests never change data.
    - Web storefronts send `device-type: web` (as the legacy website does): the store's default-area
      rules for new guests — and so which inventory and prices they see — depend on it.

    Error codes: `unauthenticated` (401), `not_found` (404), `validation_failed` (422, with `fields`),
    `quantity_not_allowed` (422), `compare_full` (409), `rate_limited` (429), `server_error` (500).
    Shopping: `already_available` (409). Checkout and orders: `total_changed` (409), `checkout_incomplete` (409),
    `payment_change_needs_consent` (409), `order_in_progress` (409), `cannot_cancel` (409),
    `guest_checkout_disabled` (403), `phone_in_use` (409), `payment_provider_error` (502).
    Auth and account: `invalid_credentials` (401), `account_deactivated` (403), `social_account_only` (403),
    `signup_disabled` (403), `feature_disabled` (403), `wrong_password` (403), `pending_approval` (403),
    `email_in_use` (409), `phone_already_verified` (409), `already_rated` (409), `cannot_rate` (409), `invalid_code` (422),
    `code_expired` (422), `too_many_attempts` (429), `provider_error` (502), `sms_unavailable` (503).
    Account extras: `prescription_blocked` (409), `cannot_redeem` (409, loyalty: `error.message` says why).
    Store: `store_unavailable` (503) on every endpoint while the merchant has switched the store off
    (`error.message` is the merchant's maintenance text).

    Auth: sign-in, sign-up, social sign-in, OTP and password reset answer a `Session` (`token` + `customer`).
    Sent WITH a guest bearer token they merge the guest's cart, wishlist and compare into the customer.
    `POST /auth/sign-out` revokes the token: every later call with it answers 401 `unauthenticated`.
    `Session.next` says what the storefront must do next (`verify_phone`, `waiting_approval` or null).

    Structured data and page meta come from the backend (`Seo`, `GET /seo/site`, `GET /sitemap`):
    the storefront only turns Targets into its own URLs and serializes JSON-LD; it never invents SEO facts.
    Marketing tags come from `Layout.marketing`; server-side conversion events are sent with `POST /events`.

    Money: every amount is a `Money` or a `Price` with ready-to-show text. Storefronts show that text and
    never format, add up or compare the numbers.

    Listing links: sort options, filter values and "remove filter" chips carry a `query` string written by
    the backend. Storefronts use it as the query of their own listing URL and send the same parameters back
    to `GET /products`. They never build filter parameters themselves.

    Checkout: the storefront sends the shopper's choices and no prices. `POST /checkout` answers with
    everything to show (options, what is missing, the price lines and the total). `POST /orders` must send
    back the total that was shown (`expectedTotal`); the backend refuses the order if its own total differs.
    After an online payment the shopper returns to the storefront's own `returnUrl` with `?checkout=<reference>`;
    the real result comes from `GET /checkout/result`, never from the URL.
servers:
  - url: https://staging-seif.witheldokan.com/api/customer/v3
    description: seif staging
paths:
  /layout:
    get:
      operationId: getLayout
      summary: Site chrome shared by every page (header, top bar, navigation, footer)
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Layout
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: '#/components/schemas/Layout' }
        default: { $ref: '#/components/responses/Error' }
  /home:
    get:
      operationId: getHome
      summary: Home page content
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Home page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: '#/components/schemas/Home' }
        default: { $ref: '#/components/responses/Error' }

  /session/guest:
    post:
      operationId: createGuestSession
      summary: Start a guest session (only way to get a guest token)
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '201':
          description: Guest session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSessionResponse' }
        default: { $ref: '#/components/responses/Error' }

  /me:
    get:
      operationId: getMe
      summary: Who is shopping and the header counts. Works without a token.
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Shopper summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        default: { $ref: '#/components/responses/Error' }

  /cart:
    get:
      operationId: getCart
      summary: The shopper's cart with backend-computed totals and checkout rules
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: clearCart
      summary: Remove every item
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Empty cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        default: { $ref: '#/components/responses/Error' }

  /cart/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Locale'
    put:
      operationId: setCartItem
      summary: Set the quantity of a product in the cart (adds it if missing). Quantity 0 removes it.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: number, minimum: 0, maximum: 200 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeCartItem
      summary: Remove a product from the cart
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        default: { $ref: '#/components/responses/Error' }

  /wishlist:
    get:
      operationId: getWishlist
      summary: Paginated wishlist, newest first
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Wishlist page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistResponse' }
        default: { $ref: '#/components/responses/Error' }

  /wishlist/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Locale'
    put:
      operationId: addToWishlist
      summary: Add a product (idempotent)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Wishlist state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListStateResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeFromWishlist
      summary: Remove a product (idempotent)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Wishlist state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListStateResponse' }
        default: { $ref: '#/components/responses/Error' }

  /wishlist/items/{productId}/move-to-cart:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Locale'
    post:
      operationId: moveWishlistItemToCart
      summary: Add one unit to the cart and remove the product from the wishlist
      security: [{ bearer: [] }]
      responses:
        '200':
          description: New cart and wishlist state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [cart, wishlist]
                    additionalProperties: false
                    properties:
                      cart: { $ref: '#/components/schemas/Cart' }
                      wishlist: { $ref: '#/components/schemas/ListState' }
        default: { $ref: '#/components/responses/Error' }

  /compare:
    get:
      operationId: getCompare
      summary: Compared products and the comparison table
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Comparison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompareResponse' }
        default: { $ref: '#/components/responses/Error' }

  /compare/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Locale'
    put:
      operationId: addToCompare
      summary: Add a product (idempotent). 409 compare_full when the backend maximum is reached.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Compare state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListStateResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeFromCompare
      summary: Remove a product (idempotent)
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Compare state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListStateResponse' }
        default: { $ref: '#/components/responses/Error' }

  /notifications:
    get:
      operationId: getNotifications
      summary: Paginated notifications, newest first. Read-only (never marks anything as read).
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Notifications page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification as read for this shopper only
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Unread count after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResponse' }
        default: { $ref: '#/components/responses/Error' }

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every notification as read for this shopper only
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Unread count after the change (0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- shopping

  /products:
    get:
      operationId: getProducts
      summary: One product listing for every listing page (category, brand, list, deals, tag, search, all products)
      description: |
        Send at most one scope (`category`, `brand`, `list`, `tag`, `deals`, `q`); none = all products.
        Filter and sort parameters come from the `query` strings of a previous answer: pass them through
        as they are. Works without a token; with a token prices and limits are the shopper's.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: category, in: query, required: false, description: 'CategoryTarget.path joined with "/"', schema: { type: string } }
        - { name: brand, in: query, required: false, description: BrandTarget.slug, schema: { type: string } }
        - { name: list, in: query, required: false, description: 'ListTarget.slug, or ListTarget.id when the slug is null', schema: { type: string } }
        - { name: tag, in: query, required: false, description: TagTarget.slug, schema: { type: string } }
        - { name: deals, in: query, required: false, schema: { type: boolean } }
        - { name: q, in: query, required: false, description: Search text, schema: { type: string, maxLength: 200 } }
        - { name: brands, in: query, required: false, description: 'Filter. Only from a `query` string.', schema: { type: string } }
        - { name: categories, in: query, required: false, description: 'Filter. Only from a `query` string.', schema: { type: string } }
        - { name: options, in: query, required: false, description: 'Filter. Only from a `query` string.', schema: { type: string } }
        - { name: inStock, in: query, required: false, description: 'Filter. Only from a `query` string.', schema: { type: boolean } }
        - { name: priceMin, in: query, required: false, description: Filter typed by the shopper (see ListingFacet.range), schema: { type: number, minimum: 0 } }
        - { name: priceMax, in: query, required: false, description: Filter typed by the shopper (see ListingFacet.range), schema: { type: number, minimum: 0 } }
        - { name: sort, in: query, required: false, description: 'Only from a `query` string.', schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - { name: perPage, in: query, required: false, description: Default and maximum are store settings, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Listing (an empty result is 200 with no items)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListingResponse' }
        default: { $ref: '#/components/responses/Error' }

  /products/{slug}:
    parameters:
      - $ref: '#/components/parameters/ProductSlug'
      - $ref: '#/components/parameters/Locale'
    get:
      operationId: getProduct
      summary: Product page. The backend picks the variant, prices it and decides every option's state.
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetailsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /products/{slug}/recommendations:
    parameters:
      - $ref: '#/components/parameters/ProductSlug'
      - $ref: '#/components/parameters/Locale'
    get:
      operationId: getProductRecommendations
      summary: Product rows for the product page (related, similar, bought together), in the order to show them
      responses:
        '200':
          description: Recommendation sections (only sections with products)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductRecommendationsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /products/{slug}/reviews:
    parameters:
      - $ref: '#/components/parameters/ProductSlug'
      - $ref: '#/components/parameters/Locale'
    get:
      operationId: getProductReviews
      summary: Rating summary and reviews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Reviews (`enabled` false when the store has reviews switched off)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductReviewsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /products/{productId}/notify-me:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Locale'
    post:
      operationId: notifyWhenAvailable
      summary: Tell the shopper when an out-of-stock product is back. 409 already_available when it is in stock.
      security: [{ bearer: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email, nullable: true }
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [subscribed]
                    additionalProperties: false
                    properties:
                      subscribed: { type: boolean, enum: [true] }
        default: { $ref: '#/components/responses/Error' }

  /search/suggestions:
    get:
      operationId: getSearchSuggestions
      summary: Products to show under the search box while typing. Read-only.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 6 } }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSuggestionsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /categories:
    get:
      operationId: getCategories
      summary: The category tree (categories, groups, sub-categories) for a categories page
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriesResponse' }
        default: { $ref: '#/components/responses/Error' }

  /brands:
    get:
      operationId: getBrands
      summary: Brands index
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 48 } }
      responses:
        '200':
          description: Brands page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /resolve:
    get:
      operationId: resolvePath
      summary: What an unknown path is (old storefront URLs, the merchant's redirect table)
      description: |
        For paths the storefront has no page for. Always 200; `result` says what to do:
        `target` → redirect (permanent) to the storefront's own URL of that Target; `redirect` → follow
        `target` or `url` with `permanent`; `gone` → answer 410; `not_found` → answer 404.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: path, in: query, required: true, description: 'Path and query as requested, e.g. /en/product/skin-care/face-care', schema: { type: string, maxLength: 2000 } }
      responses:
        '200':
          description: Resolution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolutionResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- checkout and orders

  /checkout/settings:
    get:
      operationId: getCheckoutSettings
      summary: What this store's checkout supports and how its address form looks. No token needed.
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Checkout settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSettingsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /checkout:
    post:
      operationId: computeCheckout
      summary: Compute the checkout for the shopper's choices. Never writes; call it after every change.
      description: |
        A choice that is no longer valid (deleted address, payment method not offered any more) is dropped,
        explained in `messages` and listed again in `missing`. The call does not fail because of it.
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutSelections' }
      responses:
        '200':
          description: Checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        default: { $ref: '#/components/responses/Error' }

  /checkout/contact:
    put:
      operationId: setCheckoutContact
      summary: Contact details of a guest who checks out without an account
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, phone]
              additionalProperties: false
              properties:
                firstName: { type: string, minLength: 1, maxLength: 100 }
                lastName: { type: string, minLength: 1, maxLength: 100 }
                phone: { type: string, minLength: 5, maxLength: 20 }
                email: { type: string, format: email, nullable: true }
      responses:
        '200':
          description: Saved contact
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: '#/components/schemas/CheckoutContact' }
        default: { $ref: '#/components/responses/Error' }

  /checkout/result:
    get:
      operationId: getCheckoutResult
      summary: The real state of an order or payment. Call it on the page the shopper returns to.
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: ref, in: query, required: true, description: '`next.reference` from POST /orders, or the `checkout` parameter on the return URL', schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Result (poll while `status` is pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResultResponse' }
        default: { $ref: '#/components/responses/Error' }

  /uploads:
    post:
      operationId: uploadFile
      summary: Upload a prescription image. The returned id goes in `prescriptionFiles`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'jpg, png, webp or pdf, up to 10 MB' }
      responses:
        '201':
          description: Uploaded file
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: '#/components/schemas/UploadedFile' }
        default: { $ref: '#/components/responses/Error' }

  /locations:
    get:
      operationId: getLocations
      summary: Cities, areas and districts for the address form. No token needed.
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /pickup-branches:
    get:
      operationId: getPickupBranches
      summary: Branches where an order can be collected
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Branches (empty when the store has no pickup)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupBranchesResponse' }
        default: { $ref: '#/components/responses/Error' }

  /addresses:
    get:
      operationId: getAddresses
      summary: The shopper's address book
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAddress
      summary: Add an address
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: The new address and the whole address book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressSavedResponse' }
        default: { $ref: '#/components/responses/Error' }

  /addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
      - $ref: '#/components/parameters/Locale'
    put:
      operationId: updateAddress
      summary: Change an address. The answer carries the address id to use from now on (it can be a new id).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: The saved address and the whole address book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressSavedResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAddress
      summary: Remove an address
      security: [{ bearer: [] }]
      responses:
        '200':
          description: The address book after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesResponse' }
        default: { $ref: '#/components/responses/Error' }

  /addresses/{addressId}/default:
    parameters:
      - $ref: '#/components/parameters/AddressId'
      - $ref: '#/components/parameters/Locale'
    post:
      operationId: setDefaultAddress
      summary: Make this the default address
      security: [{ bearer: [] }]
      responses:
        '200':
          description: The address book after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesResponse' }
        default: { $ref: '#/components/responses/Error' }

  /orders:
    get:
      operationId: getOrders
      summary: The shopper's orders, newest first
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Orders page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: placeOrder
      summary: Place the order for the shopper's cart
      description: |
        Send the same choices as the last `POST /checkout` plus the total that was shown.
        409 `total_changed` / `checkout_incomplete` / `payment_change_needs_consent` carry the fresh
        `checkout` next to `error`: show it and let the shopper confirm again.
        An `Idempotency-Key` header makes a retry with the same key return the first answer.
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '200':
          description: What to do next
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceOrderResponse' }
        default: { $ref: '#/components/responses/Error' }

  /orders/cancellation-reasons:
    get:
      operationId: getOrderCancellationReasons
      summary: Reasons the shopper can pick when cancelling
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationReasonsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/Locale'
    get:
      operationId: getOrder
      summary: One order of the shopper. Read-only.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }

  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/Locale'
    post:
      operationId: cancelOrder
      summary: Cancel an order (only while `actions.canCancel`). 409 cannot_cancel otherwise.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonId]
              additionalProperties: false
              properties:
                reasonId: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 500, nullable: true }
      responses:
        '200':
          description: The order after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }

  /orders/{orderId}/reorder:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/Locale'
    post:
      operationId: reorder
      summary: Add the order's items to the cart again. Items that can't be bought now are skipped and listed.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: The cart and what was skipped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReorderResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- auth (v3)
  /auth/settings:
    get:
      operationId: getAuthSettings
      summary: What the sign-in / sign-up pages show, decided from the store's configuration
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Auth settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSettingsResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with a password. A guest bearer token, if sent, is merged into the customer.
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/sign-up:
    post:
      operationId: signUp
      summary: Create an account (signed in on success). A guest bearer token, if sent, becomes the customer.
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the bearer token (later calls with it answer 401)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedOutResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/social:
    post:
      operationId: signInWithProvider
      summary: Sign in or sign up with Google, Facebook or Apple (the provider's token is verified by the backend)
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialSignInRequest' }
      responses:
        '200':
          description: Signed in. `next` = `complete_profile` when the provider gave no phone number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/social/complete:
    post:
      operationId: completeSocialProfile
      summary: Add the name and phone a social provider did not give (after `next = complete_profile`)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteProfileRequest' }
      responses:
        '200':
          description: Profile completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/otp/send:
    post:
      operationId: sendOtp
      summary: Send a one-time sign-in code by SMS (only when `AuthSettings.otpLogin` is true)
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone: { type: string }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSentResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      operationId: signInWithOtp
      summary: Sign in with the SMS code
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              additionalProperties: false
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Start a password reset (code by SMS or link by e-mail, as the store is configured)
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: Sent. `method` says what the shopper receives and which reset request to send next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForgotPasswordResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with the SMS code or the e-mail token; signs the shopper in
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password changed and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/phone/send-code:
    post:
      operationId: sendPhoneVerificationCode
      summary: Send (again) the SMS code that verifies the signed-in customer's phone
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSentResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/phone/verify:
    post:
      operationId: verifyPhone
      summary: Verify the signed-in customer's phone with the SMS code
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string }
      responses:
        '200':
          description: Phone verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Confirm a changed e-mail address with the token from the e-mail
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              additionalProperties: false
              properties:
                email: { type: string }
                token: { type: string }
      responses:
        '200':
          description: E-mail confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- account (v3)
  /account/profile:
    get:
      operationId: getProfile
      summary: The signed-in customer's profile and the form to edit it
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateProfile
      summary: Edit the profile. A changed phone is unverified again and a code is sent (`next = verify_phone`).
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        default: { $ref: '#/components/responses/Error' }
  /account/password:
    put:
      operationId: changePassword
      summary: Change the password (needs the current one)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default: { $ref: '#/components/responses/Error' }
  /me/area:
    put:
      operationId: setArea
      summary: Choose the shopper's area (multi-inventory stores; see `Layout.areaSelection`)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaId]
              additionalProperties: false
              properties:
                areaId: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The shopper summary with the new area
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- seo + marketing (v3)
  /seo/site:
    get:
      operationId: getSiteSeo
      summary: Site-wide structured-data facts (organization, local business, website) and the robots policy
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Site SEO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSeoResponse' }
        default: { $ref: '#/components/responses/Error' }
  /sitemap:
    get:
      operationId: getSitemap
      summary: Everything a sitemap should list, as Targets (the storefront writes the URLs)
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [products, categories, brands, pages, landing_pages, tags] }
        - $ref: '#/components/parameters/Page'
        - name: perPage
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        '200':
          description: Sitemap entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitemapResponse' }
        default: { $ref: '#/components/responses/Error' }
  /events:
    post:
      operationId: trackEvent
      summary: Server-side marketing event (conversion APIs). Never affects what a page shows.
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventRequest' }
      responses:
        '202':
          description: Accepted (also when no conversion API is configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventAcceptedResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- content (v3)
  /pages/{slug}:
    get:
      operationId: getPage
      summary: A CMS page (about, policies, contact, branches...)
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageResponse' }
        default: { $ref: '#/components/responses/Error' }
  /branches:
    get:
      operationId: getBranches
      summary: The store's branches, grouped as the merchant grouped them
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchesResponse' }
        default: { $ref: '#/components/responses/Error' }
  /contact:
    post:
      operationId: sendContactMessage
      summary: Send a contact-us message
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRequest' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default: { $ref: '#/components/responses/Error' }
  /landing-pages/{slug}:
    get:
      operationId: getLandingPage
      summary: A merchant landing page (home-style sections and banners)
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingPageResponse' }
        default: { $ref: '#/components/responses/Error' }
  /forms/{slug}:
    get:
      operationId: getForm
      summary: A merchant-defined form (fields, labels, what is required)
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormResponse' }
        default: { $ref: '#/components/responses/Error' }
  /forms/{slug}/responses:
    post:
      operationId: submitForm
      summary: Submit a form (the backend validates against the form definition)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmission' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orders: tracking, rating, reviews (v3)
  /orders/track:
    get:
      operationId: trackOrder
      summary: Find an order by its number and the phone it was placed with (no sign-in)
      parameters:
        - $ref: '#/components/parameters/Locale'
        - name: number
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: phone
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 32 }
      responses:
        '200':
          description: The order (404 `not_found` when the pair does not match)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{orderId}/rate:
    post:
      operationId: rateOrder
      summary: Rate a delivered order (only when `Order.actions.canRate`)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateOrderRequest' }
      responses:
        '200':
          description: The order with its rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }
  /reviews:
    post:
      operationId: writeProductReview
      summary: Write a product review (moderated; it shows once the merchant approves it)
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteReviewRequest' }
      responses:
        '201':
          description: Review received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        default: { $ref: '#/components/responses/Error' }


  # ---------------------------------------------------------------- account extras: prescriptions (customer only)

  /prescriptions/form:
    get:
      operationId: getPrescriptionForm
      summary: 'How to draw the prescription form for this customer: texts, fields, address choices and what blocks sending. 404 while the store has prescriptions off.'
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: The form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionFormResponse' }
        default: { $ref: '#/components/responses/Error' }

  /prescriptions:
    get:
      operationId: getPrescriptions
      summary: "The customer's prescriptions, newest first. 404 while the store has prescriptions off."
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: One page of prescriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionsResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: sendPrescription
      summary: 'Send a prescription (files from POST /uploads, an address of the customer). 409 prescription_blocked while `PrescriptionForm.blockers` is not empty; 422 validation_failed with `fields` by these names.'
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrescriptionRequest' }
      responses:
        '201':
          description: The prescription and a thank-you text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionSentResponse' }
        default: { $ref: '#/components/responses/Error' }

  /prescriptions/cancellation-reasons:
    get:
      operationId: getPrescriptionCancellationReasons
      summary: Reasons the customer can pick when cancelling a prescription
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancellationReasonsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /prescriptions/{prescriptionId}/cancel:
    parameters:
      - { name: prescriptionId, in: path, required: true, description: Prescription.id, schema: { type: string, minLength: 1, maxLength: 64 } }
      - $ref: '#/components/parameters/Locale'
    post:
      operationId: cancelPrescription
      summary: Cancel a prescription (only while `actions.canCancel`). 409 cannot_cancel otherwise; 404 for someone else's.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonId]
              additionalProperties: false
              properties:
                reasonId: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 500, nullable: true }
      responses:
        '200':
          description: The prescription after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionResponse' }
        default: { $ref: '#/components/responses/Error' }

  /loyalty:
    get:
      operationId: getLoyalty
      summary: "The customer's points and which loyalty pages exist (`sections`). 404 while the store has no loyalty provider v3 supports (El Dokan, iVend)."
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltySummaryResponse' }
        default: { $ref: '#/components/responses/Error' }

  /loyalty/history:
    get:
      operationId: getLoyaltyHistory
      summary: 'Points earned, pending, used and expired, newest first. 404 unless `LoyaltySummary.sections.history`.'
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: One page of the history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyHistoryResponse' }
        default: { $ref: '#/components/responses/Error' }

  /loyalty/rewards:
    get:
      operationId: getLoyaltyRewards
      summary: 'The rewards the customer can spend points on, with `canRedeem` and the reason when not. 404 unless `LoyaltySummary.sections.rewards`.'
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: The rewards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyRewardsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /loyalty/rewards/{rewardId}:
    parameters:
      - { name: rewardId, in: path, required: true, description: LoyaltyReward.id, schema: { type: string, minLength: 1, maxLength: 20 } }
      - $ref: '#/components/parameters/Locale'
    get:
      operationId: getLoyaltyReward
      summary: One reward (its details page). 404 when it does not exist or is not active.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: The reward
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyRewardResponse' }
        default: { $ref: '#/components/responses/Error' }

  /loyalty/rewards/{rewardId}/redeem:
    parameters:
      - { name: rewardId, in: path, required: true, description: LoyaltyReward.id, schema: { type: string, minLength: 1, maxLength: 20 } }
      - $ref: '#/components/parameters/Locale'
    post:
      operationId: redeemLoyaltyReward
      summary: 'Spend points on a reward (only while `canRedeem`). 409 cannot_redeem otherwise, with the reason in `error.message`. A voucher reward answers its code.'
      security: [{ bearer: [] }]
      responses:
        '201':
          description: Redeemed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyRedeemResponse' }
        default: { $ref: '#/components/responses/Error' }

  /loyalty/referral:
    get:
      operationId: getLoyaltyReferral
      summary: "The customer's referral code and how it works. 404 unless `LoyaltySummary.sections.referral`."
      security: [{ bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: The referral
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyReferralResponse' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    Locale:
      name: locale
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Locale' }
    ProductId:
      name: productId
      in: path
      required: true
      description: ProductCard.id
      schema: { type: integer, minimum: 1 }
    ProductSlug:
      name: slug
      in: path
      required: true
      description: ProductTarget.slug (either language)
      schema: { type: string, minLength: 1 }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      description: Order.id
      schema: { type: string, minLength: 1, maxLength: 64 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: perPage
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Locale:
      type: string
      enum: [en, ar]

    Target:
      description: Where a click goes. `null` wherever a Target is optional means "not clickable".
      oneOf:
        - $ref: '#/components/schemas/ProductTarget'
        - $ref: '#/components/schemas/CategoryTarget'
        - $ref: '#/components/schemas/BrandTarget'
        - $ref: '#/components/schemas/ListTarget'
        - $ref: '#/components/schemas/PageTarget'
        - $ref: '#/components/schemas/LandingPageTarget'
        - $ref: '#/components/schemas/FormTarget'
        - $ref: '#/components/schemas/DealsTarget'
        - $ref: '#/components/schemas/HomeTarget'
        - $ref: '#/components/schemas/UrlTarget'
        - $ref: '#/components/schemas/TagTarget'
        - $ref: '#/components/schemas/SearchTarget'
      discriminator:
        propertyName: type
        mapping:
          product: '#/components/schemas/ProductTarget'
          category: '#/components/schemas/CategoryTarget'
          brand: '#/components/schemas/BrandTarget'
          list: '#/components/schemas/ListTarget'
          page: '#/components/schemas/PageTarget'
          landing_page: '#/components/schemas/LandingPageTarget'
          form: '#/components/schemas/FormTarget'
          deals: '#/components/schemas/DealsTarget'
          home: '#/components/schemas/HomeTarget'
          url: '#/components/schemas/UrlTarget'
          tag: '#/components/schemas/TagTarget'
          search: '#/components/schemas/SearchTarget'
    ProductTarget:
      type: object
      required: [type, slug]
      additionalProperties: false
      properties:
        type: { type: string, enum: [product] }
        slug: { type: string, minLength: 1 }
    CategoryTarget:
      type: object
      required: [type, path]
      additionalProperties: false
      properties:
        type: { type: string, enum: [category] }
        path:
          description: Category slug, then optional group / sub-category slugs.
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, minLength: 1 }
    BrandTarget:
      type: object
      required: [type, slug]
      additionalProperties: false
      properties:
        type: { type: string, enum: [brand] }
        slug: { type: string, minLength: 1 }
    ListTarget:
      type: object
      required: [type, slug, id]
      additionalProperties: false
      properties:
        type: { type: string, enum: [list] }
        slug: { type: string, nullable: true }
        id: { type: integer, nullable: true }
    PageTarget:
      type: object
      required: [type, slug]
      additionalProperties: false
      properties:
        type: { type: string, enum: [page] }
        slug: { type: string, minLength: 1 }
    LandingPageTarget:
      type: object
      required: [type, slug]
      additionalProperties: false
      properties:
        type: { type: string, enum: [landing_page] }
        slug: { type: string, minLength: 1 }
    FormTarget:
      type: object
      required: [type, slug]
      additionalProperties: false
      properties:
        type: { type: string, enum: [form] }
        slug: { type: string, minLength: 1 }
    DealsTarget:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [deals] }
    HomeTarget:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [home] }
    UrlTarget:
      type: object
      required: [type, url]
      additionalProperties: false
      properties:
        type: { type: string, enum: [url] }
        url: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9+.-]*:' }
    TagTarget:
      type: object
      required: [type, slug]
      additionalProperties: false
      properties:
        type: { type: string, enum: [tag] }
        slug: { type: string, minLength: 1 }
    SearchTarget:
      description: Search results for `query` (empty = all products)
      type: object
      required: [type, query]
      additionalProperties: false
      properties:
        type: { type: string, enum: [search] }
        query: { type: string }

    NullableTarget:
      description: A Target, or null when not clickable.
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/ProductTarget'
        - $ref: '#/components/schemas/CategoryTarget'
        - $ref: '#/components/schemas/BrandTarget'
        - $ref: '#/components/schemas/ListTarget'
        - $ref: '#/components/schemas/PageTarget'
        - $ref: '#/components/schemas/LandingPageTarget'
        - $ref: '#/components/schemas/FormTarget'
        - $ref: '#/components/schemas/DealsTarget'
        - $ref: '#/components/schemas/HomeTarget'
        - $ref: '#/components/schemas/UrlTarget'
        - $ref: '#/components/schemas/TagTarget'
        - $ref: '#/components/schemas/SearchTarget'

    Image:
      type: object
      required: [url, alt]
      additionalProperties: false
      properties:
        url: { type: string }
        alt: { type: string, nullable: true }

    ResponsiveImage:
      type: object
      required: [mobile, desktop, alt]
      additionalProperties: false
      properties:
        mobile: { type: string }
        desktop: { type: string }
        alt: { type: string, nullable: true }

    Link:
      type: object
      required: [label, target]
      additionalProperties: false
      properties:
        label: { type: string }
        target: { $ref: '#/components/schemas/NullableTarget' }

    NavItem:
      type: object
      required: [label, target, image, badge, children]
      additionalProperties: false
      properties:
        label: { type: string }
        target: { $ref: '#/components/schemas/NullableTarget' }
        image: { type: string, nullable: true }
        badge: { type: string, nullable: true }
        children:
          type: array
          items: { $ref: '#/components/schemas/NavItem' }

    AppLinks:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        android: { type: string }
        ios: { type: string }
        huawei: { type: string }

    Currency:
      type: object
      required: [code, label]
      additionalProperties: false
      properties:
        code: { type: string, example: EGP }
        label: { type: string, description: Localized display label }

    Layout:
      type: object
      required: [locale, direction, locales, store, currency, announcement, topBar, header, navigation, footer, whatsapp, features]
      additionalProperties: false
      properties:
        locale: { $ref: '#/components/schemas/Locale' }
        direction: { type: string, enum: [ltr, rtl] }
        locales:
          type: array
          items: { $ref: '#/components/schemas/Locale' }
        store:
          type: object
          required: [name, slogan, logo, logoInverse, favicon]
          additionalProperties: false
          properties:
            name: { type: string, nullable: true }
            slogan: { type: string, nullable: true }
            logo: { type: string, nullable: true }
            logoInverse: { type: string, nullable: true }
            favicon: { type: string, nullable: true }
        currency:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Currency' }]
        announcement:
          description: The softbar. Null when switched off.
          type: object
          nullable: true
          required: [text, icon]
          additionalProperties: false
          properties:
            text: { type: string }
            icon: { type: string, nullable: true }
        topBar:
          type: object
          required: [message, hotline, links, appLinks]
          additionalProperties: false
          properties:
            message: { type: string, nullable: true }
            hotline: { type: string, nullable: true }
            links:
              type: array
              items: { $ref: '#/components/schemas/Link' }
            appLinks: { $ref: '#/components/schemas/AppLinks' }
        header:
          type: object
          required: [searchPlaceholder, shortcuts]
          additionalProperties: false
          properties:
            searchPlaceholder: { type: string, nullable: true }
            shortcuts:
              type: array
              items:
                type: object
                required: [label, icon, target]
                additionalProperties: false
                properties:
                  label: { type: string }
                  icon: { type: string, nullable: true }
                  target: { $ref: '#/components/schemas/Target' }
        navigation:
          type: array
          items: { $ref: '#/components/schemas/NavItem' }
        footer:
          type: object
          required: [about, contact, links, social, appLinks, newsletter]
          additionalProperties: false
          properties:
            about: { type: string, nullable: true }
            contact:
              type: object
              required: [hotline, hotlineLabel, secondaryHotline, email, address]
              additionalProperties: false
              properties:
                hotline: { type: string, nullable: true }
                hotlineLabel: { type: string, nullable: true }
                secondaryHotline: { type: string, nullable: true }
                email: { type: string, nullable: true }
                address: { type: string, nullable: true }
            links:
              description: CMS pages and forms the merchant put in the footer.
              type: array
              items: { $ref: '#/components/schemas/Link' }
            social:
              type: array
              items:
                type: object
                required: [platform, url]
                additionalProperties: false
                properties:
                  platform: { type: string, example: instagram, description: 'facebook | instagram | x | youtube | linkedin | tiktok | snapchat | other names' }
                  url: { type: string }
            appLinks: { $ref: '#/components/schemas/AppLinks' }
            newsletter:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, nullable: true }
        whatsapp:
          type: object
          nullable: true
          required: [number, url]
          additionalProperties: false
          properties:
            number: { type: string }
            url: { type: string }
        features:
          description: Store switches that decide which UI entry points exist.
          type: object
          required: [signup, compare, wishlist, notifications, orderTracking, contactPage, branches, prescriptions, cookieConsent, newsletter, guestCanViewPrices]
          additionalProperties: { type: boolean }
          properties:
            signup: { type: boolean }
            compare: { type: boolean }
            wishlist: { type: boolean }
            notifications: { type: boolean }
            orderTracking: { type: boolean }
            contactPage: { type: boolean }
            branches: { type: boolean }
            prescriptions: { type: boolean }
            cookieConsent: { type: boolean }
            newsletter: { type: boolean }
            guestCanViewPrices: { type: boolean }
            productReviews: { type: boolean, description: Shoppers may write product reviews }
            orderRating: { type: boolean, description: Shoppers may rate delivered orders }
            share: { type: boolean, description: Show the share button on product pages }
            loyalty: { type: boolean, description: 'The store has a loyalty provider v3 supports (El Dokan, iVend): show the points entry points (absent = off)' }
        # ---- added for the shell phase (optional: older recordings may lack them; absent = feature off)
        marketing: { $ref: '#/components/schemas/Marketing' }
        legal:
          description: The store's legal pages (CMS). Null entries → no page.
          type: object
          required: [privacy, terms, cookies]
          additionalProperties: false
          properties:
            privacy: { $ref: '#/components/schemas/NullableTarget' }
            terms: { $ref: '#/components/schemas/NullableTarget' }
            cookies: { $ref: '#/components/schemas/NullableTarget' }
        appBanner:
          description: The "download our app" banner. Null when switched off.
          type: object
          nullable: true
          required: [title, text, links]
          additionalProperties: false
          properties:
            title: { type: string, nullable: true }
            text: { type: string, nullable: true }
            links: { $ref: '#/components/schemas/AppLinks' }
        topBanner:
          description: A merchant ad shown above the header on every page; null when none is active
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Banner' }]
        floatingBanner:
          description: A merchant ad that floats over the page; null when none is active
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Banner' }]
        mobileNav:
          description: The mobile bottom bar and its "more" sheet, already filtered by the store's features
          type: object
          required: [items, more]
          additionalProperties: false
          properties:
            items:
              description: At most 4 fixed items plus `more`
              type: array
              items: { $ref: '#/components/schemas/MobileNavItem' }
            more:
              type: object
              required: [title, welcomeTitle, welcomeText, items]
              additionalProperties: false
              properties:
                title: { type: string }
                welcomeTitle: { type: string, nullable: true, description: For visitors who are not signed in }
                welcomeText: { type: string, nullable: true }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/MobileNavItem' }
        areaSelection:
          description: |
            Multi-inventory stores ask the shopper where they are, because inventory and prices depend on it.
            Null → the store has one inventory. The current choice is `Me.area`; change it with PUT /me/area;
            the choices come from GET /locations.
          type: object
          nullable: true
          required: [required, label, prompt]
          additionalProperties: false
          properties:
            required: { type: boolean, description: True → ask before the shopper can browse prices }
            label: { type: string, description: 'Header label, e.g. "Deliver to"' }
            prompt: { type: string, description: 'Dialog text, e.g. "Choose your area to see what is available near you"' }
        storeStatus:
          description: Whether the store takes orders right now and the merchant's text when it does not
          type: object
          required: [acceptingOrders, message]
          additionalProperties: false
          properties:
            acceptingOrders: { type: boolean }
            message: { type: string, nullable: true }

    Price:
      description: |
        Computed and formatted by the backend. Show `display`, `compareAtDisplay` and `discountLabel`
        as they are. The numbers are for sorting and analytics only: never format or recompute them.
      type: object
      required: [currency, amount, compareAt, discountPercent, display, compareAtDisplay, discountLabel]
      additionalProperties: false
      properties:
        currency: { type: string, nullable: true }
        amount: { type: number, description: What the shopper pays }
        compareAt: { type: number, nullable: true, description: Original price when discounted }
        discountPercent: { type: integer, nullable: true }
        display: { type: string, description: 'Ready-to-show text for `amount` in the request language, e.g. "176 EGP", "1,260 جنية"', example: 176 EGP }
        compareAtDisplay: { type: string, nullable: true, description: 'Ready-to-show text for `compareAt`; null when not discounted', example: 196 EGP }
        discountLabel: { type: string, nullable: true, description: 'Ready-to-show discount text, e.g. "10 %" (store settings may add decimals or "OFF"); null when not discounted', example: '10 %' }

    ProductCard:
      type: object
      required: [id, slug, name, image, brand, price, inStock, badges, rating, requiresPrescription, purchase, target]
      additionalProperties: false
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        image:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Image' }]
        brand:
          type: object
          nullable: true
          required: [name, slug, target]
          additionalProperties: false
          properties:
            name: { type: string }
            slug: { type: string }
            target: { $ref: '#/components/schemas/BrandTarget' }
        price:
          description: Null when the store hides prices for this shopper.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Price' }]
        inStock: { type: boolean }
        badges:
          type: array
          items:
            type: object
            required: [kind, text, color]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [label, promotion, preorder, coming_soon] }
              text: { type: string, nullable: true }
              color: { type: string, nullable: true }
        rating:
          type: object
          nullable: true
          required: [average, count]
          additionalProperties: false
          properties:
            average: { type: number }
            count: { type: integer }
        requiresPrescription: { type: boolean }
        purchase:
          type: object
          required: [canAddToCart, minQuantity, maxQuantity]
          additionalProperties: false
          properties:
            canAddToCart: { type: boolean }
            minQuantity: { type: integer, minimum: 1 }
            maxQuantity: { type: integer, nullable: true }
        target: { $ref: '#/components/schemas/ProductTarget' }

    Banner:
      type: object
      required: [id, image, title, target]
      additionalProperties: false
      properties:
        id: { type: integer }
        image: { $ref: '#/components/schemas/ResponsiveImage' }
        title: { type: string, nullable: true }
        target: { $ref: '#/components/schemas/NullableTarget' }

    PromoBanner:
      type: object
      required: [id, placement, image, title, target]
      additionalProperties: false
      properties:
        id: { type: integer }
        placement: { type: string, description: 'Merchant-named slot, e.g. top-ad, bottom-ad' }
        image: { $ref: '#/components/schemas/ResponsiveImage' }
        title: { type: string, nullable: true }
        target: { $ref: '#/components/schemas/NullableTarget' }

    Popup:
      type: object
      required: [id, image, title, description, frequency, target]
      additionalProperties: false
      properties:
        id: { type: integer }
        image: { $ref: '#/components/schemas/ResponsiveImage' }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        frequency: { type: string, enum: [always, once_per_session, once_per_day] }
        target: { $ref: '#/components/schemas/NullableTarget' }

    SectionLayout:
      description: What the merchant picked in the admin. A hint; draw it your way. Unknown values → render as banner_grid.
      type: string
      enum: [products_only, single_banner, banner_carousel, wide_banner, banner_grid, banner_rows]

    Section:
      description: Only sections with something to show are returned.
      type: object
      required: [id, title, layout, banners, products, viewAll]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string, nullable: true, description: Null when the title is hidden }
        layout: { $ref: '#/components/schemas/SectionLayout' }
        banners:
          type: array
          items: { $ref: '#/components/schemas/Banner' }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        viewAll: { $ref: '#/components/schemas/NullableTarget' }

    Tile:
      type: object
      required: [id, name, image, target]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        image:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Image' }]
        target: { $ref: '#/components/schemas/Target' }

    Home:
      type: object
      required: [promoBanners, featuredCategories, sections, featuredBrands, popups]
      additionalProperties: false
      properties:
        promoBanners:
          type: array
          items: { $ref: '#/components/schemas/PromoBanner' }
        featuredCategories:
          type: array
          items: { $ref: '#/components/schemas/Tile' }
        sections:
          description: In the merchant's order.
          type: array
          items: { $ref: '#/components/schemas/Section' }
        featuredBrands:
          type: array
          items: { $ref: '#/components/schemas/Tile' }
        popups:
          type: array
          items: { $ref: '#/components/schemas/Popup' }
        # ---- added for the SEO phase (optional: older recordings may lack it)
        seo:
          description: 'The home page meta and structured data: title and description, WebPage facts, preview image'
          allOf: [{ $ref: '#/components/schemas/Seo' }]

    # ---------------------------------------------------------------- shopper

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        checkout:
          description: The fresh checkout, sent with total_changed, checkout_incomplete and payment_change_needs_consent
          allOf: [{ $ref: '#/components/schemas/Checkout' }]
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, example: server_error }
            message: { type: string, description: 'Localized, safe to show' }
            fields:
              description: Per-field messages (validation_failed)
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    Money:
      description: |
        An amount computed and formatted by the backend. Show `display` as it is. `amount` is for
        analytics only: never format it and never do arithmetic on it.
      type: object
      required: [amount, currency, display]
      additionalProperties: false
      properties:
        amount: { type: number }
        currency: { type: string, nullable: true }
        display: { type: string, description: 'Ready-to-show text in the request language, e.g. "36 EGP"; totals always have 2 decimals, e.g. "196.00 EGP"', example: 196.00 EGP }

    Pagination:
      type: object
      required: [page, perPage, total, totalPages]
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    GuestSessionResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [token, isGuest]
          additionalProperties: false
          properties:
            token: { type: string, description: 'Send as Authorization: Bearer <token>. Keep it server-side (httpOnly cookie).' }
            isGuest: { type: boolean, enum: [true] }

    Me:
      type: object
      required: [authenticated, isGuest, customer, counts, cartQuantities, wishlistProductIds, compareProductIds]
      additionalProperties: false
      properties:
        authenticated: { type: boolean, description: False when no valid token was sent }
        isGuest: { type: boolean }
        customer:
          type: object
          nullable: true
          required: [firstName]
          additionalProperties: false
          properties:
            firstName: { type: string }
            # added for the account phase (optional for older recordings)
            lastName: { type: string }
            phoneVerified: { type: boolean }
            approval:
              type: string
              nullable: true
              enum: [pending, approved, rejected, null]
              description: Null when the store does not approve customers by hand
        # added for the shell phase (optional for older recordings)
        area:
          description: The shopper's chosen area (multi-inventory stores); null when none or when the store has one inventory
          type: object
          nullable: true
          required: [id, name, city]
          additionalProperties: false
          properties:
            id: { type: integer }
            name: { type: string }
            city: { type: string, nullable: true }
        next:
          description: What the storefront must do before the shopper can go on (same values as Session.next)
          type: string
          nullable: true
          enum: [verify_phone, waiting_approval, complete_profile, null]
        counts:
          description: Header badges. `cart` follows the store's counting mode (lines or units).
          type: object
          required: [cart, wishlist, compare, unreadNotifications]
          additionalProperties: false
          properties:
            cart: { type: integer, minimum: 0 }
            wishlist: { type: integer, minimum: 0 }
            compare: { type: integer, minimum: 0 }
            unreadNotifications: { type: integer, minimum: 0 }
        cartQuantities:
          description: productId (as string) → quantity in cart, to mark "in cart" on product cards
          type: object
          additionalProperties: { type: number }
        wishlistProductIds:
          type: array
          items: { type: integer }
        compareProductIds:
          type: array
          items: { type: integer }
    MeResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Me' }

    CartItemAvailability:
      description: Whether this line can be checked out as is, decided by the backend.
      type: object
      required: [status, message, minQuantity, maxQuantity]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [available, out_of_stock, unavailable, coming_soon, exceeds_limit, below_minimum]
        message: { type: string, nullable: true, description: Localized explanation; null when available }
        minQuantity: { type: number, minimum: 1 }
        maxQuantity: { type: number, nullable: true, description: Most the shopper may have in the cart; null = no limit }

    CartItem:
      type: object
      required: [product, quantity, quantityStep, unitPrice, lineTotal, availability]
      additionalProperties: false
      properties:
        product: { $ref: '#/components/schemas/ProductCard' }
        quantity: { type: number, minimum: 0 }
        quantityStep: { type: number, description: 'Allowed increment (1, or e.g. 0.5 for weighed products)' }
        unitPrice: { $ref: '#/components/schemas/Price' }
        lineTotal:
          description: What this line costs after item promotions
          allOf: [{ $ref: '#/components/schemas/Money' }]
        availability: { $ref: '#/components/schemas/CartItemAvailability' }

    Cart:
      type: object
      required: [items, summary, checkout, requiresPrescription]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        summary:
          type: object
          required: [itemCount, subtotal, discount, total]
          additionalProperties: false
          properties:
            itemCount: { type: number, minimum: 0, description: Total units }
            subtotal: { $ref: '#/components/schemas/Money' }
            discount:
              description: Cart-level promotion discount; null when none
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Money' }]
            total:
              description: Before delivery, which is calculated at checkout
              allOf: [{ $ref: '#/components/schemas/Money' }]
        checkout:
          type: object
          required: [allowed, blockers, minimumOrder]
          additionalProperties: false
          properties:
            allowed: { type: boolean, description: Enable the checkout button only when true }
            blockers:
              description: Why checkout is not allowed (empty when allowed)
              type: array
              items:
                type: object
                required: [code, message]
                additionalProperties: false
                properties:
                  code: { type: string, enum: [empty_cart, minimum_order, unavailable_items] }
                  message: { type: string }
            minimumOrder:
              description: Null when the store has no minimum
              type: object
              nullable: true
              required: [amount, remaining, progressPercent]
              additionalProperties: false
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                remaining:
                  description: How much more to add; amount 0 when reached
                  allOf: [{ $ref: '#/components/schemas/Money' }]
                progressPercent: { type: integer, minimum: 0, maximum: 100, description: How far the cart is towards the minimum (for a progress bar); 100 when reached }
        requiresPrescription: { type: boolean }
    CartResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Cart' }

    ListState:
      description: Same shape for every add/remove on the wishlist or compare list.
      type: object
      required: [count, productIds, maxItems]
      additionalProperties: false
      properties:
        count: { type: integer, minimum: 0 }
        productIds:
          type: array
          items: { type: integer }
        maxItems: { type: integer, nullable: true, description: Null = no limit }
    ListStateResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/ListState' }

    WishlistResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items, pagination]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProductCard' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    CompareResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [products, attributes, maxItems]
          additionalProperties: false
          properties:
            products:
              type: array
              items: { $ref: '#/components/schemas/ProductCard' }
            attributes:
              description: Comparison rows. `values[i]` belongs to `products[i]`; null = product has no value.
              type: array
              items:
                type: object
                required: [name, values]
                additionalProperties: false
                properties:
                  name: { type: string }
                  values:
                    type: array
                    items: { type: string, nullable: true }
            maxItems: { type: integer, nullable: true }

    Notification:
      type: object
      required: [id, title, body, image, target, createdAt, read]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string, nullable: true }
        image: { type: string, nullable: true }
        target: { $ref: '#/components/schemas/NullableTarget' }
        createdAt: { type: string, format: date-time }
        read: { type: boolean, description: Read by THIS shopper }
    NotificationsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items, pagination, unreadCount]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Notification' }
            pagination: { $ref: '#/components/schemas/Pagination' }
            unreadCount: { type: integer, minimum: 0 }
    UnreadCountResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [unreadCount]
          additionalProperties: false
          properties:
            unreadCount: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- shopping

    RichText:
      description: |
        Formatted text written by the merchant. The backend cleans `html` (no scripts, styles, iframes or
        event handlers; links and images only with http/https addresses). It is the only HTML a storefront
        may put on a page.
      type: object
      required: [html]
      additionalProperties: false
      properties:
        html: { type: string }

    Seo:
      description: Page meta decided by the backend. Targets become the storefront's own URLs.
      type: object
      required: [title, description, canonical, alternates, index]
      additionalProperties: false
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        canonical: { $ref: '#/components/schemas/NullableTarget' }
        alternates:
          description: The same page in each language the store has
          type: array
          items:
            type: object
            required: [locale, target]
            additionalProperties: false
            properties:
              locale: { $ref: '#/components/schemas/Locale' }
              target: { $ref: '#/components/schemas/Target' }
        index: { type: boolean, description: False → tell search engines not to index this page }
        # ---- added for the SEO phase (optional: absent = nothing to add)
        breadcrumbs:
          description: Home first, this page last (the last item's target may be null)
          type: array
          items: { $ref: '#/components/schemas/Breadcrumb' }
        structuredData:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/StructuredData' }]
        pagination:
          description: 'For paginated pages: the previous / next page numbers for rel=prev/next, null at the ends'
          type: object
          nullable: true
          required: [prev, next]
          additionalProperties: false
          properties:
            prev: { type: integer, nullable: true, minimum: 1 }
            next: { type: integer, nullable: true, minimum: 1 }
        openGraph:
          description: Social preview; null members fall back to title / description / the store logo
          type: object
          nullable: true
          required: [title, description, image, type]
          additionalProperties: false
          properties:
            title: { type: string, nullable: true }
            description: { type: string, nullable: true }
            image: { type: string, nullable: true }
            type: { type: string, enum: [website, product, article] }

    ProductOption:
      description: One thing the shopper chooses (size, color). Every value says where a click on it goes.
      type: object
      required: [id, name, display, values]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        display: { type: string, enum: [buttons, dropdown, color, image], description: 'A hint; unknown values → draw as buttons' }
        values:
          type: array
          items:
            type: object
            required: [id, label, color, image, state, target]
            additionalProperties: false
            properties:
              id: { type: integer }
              label: { type: string }
              color: { type: string, nullable: true, description: CSS color for a swatch }
              image: { type: string, nullable: true }
              state:
                description: selected = the product shown now. out_of_stock = can be opened but not bought. unavailable = no such product (not clickable).
                type: string
                enum: [selected, available, out_of_stock, unavailable]
              target:
                description: The product to open when this value is clicked; null when selected or unavailable
                nullable: true
                allOf: [{ $ref: '#/components/schemas/ProductTarget' }]

    ProductAvailability:
      type: object
      required: [status, message, notifyMe]
      additionalProperties: false
      properties:
        status: { type: string, enum: [available, out_of_stock, coming_soon, preorder, unavailable] }
        message: { type: string, nullable: true, description: 'Localized text to show, e.g. "Out of stock", "Only 3 left"; null when there is nothing to say' }
        notifyMe: { type: boolean, description: 'Offer "tell me when it is back" (POST /products/{productId}/notify-me)' }

    ProductDetails:
      type: object
      required: [product, redirect, sku, gallery, video, options, availability, quantityStep, breadcrumbs, summary, description, specifications, notices, seo]
      additionalProperties: false
      properties:
        product:
          description: The product being shown (one variant). Its `id` is the one to use for cart, wishlist and compare.
          allOf: [{ $ref: '#/components/schemas/ProductCard' }]
        redirect:
          description: Set when the slug asked for is not this product's address in this language. Redirect there instead of showing the page.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ProductTarget' }]
        sku: { type: string, nullable: true, description: Null when the store hides it }
        gallery:
          description: Main image first
          type: array
          items: { $ref: '#/components/schemas/Image' }
        video:
          type: object
          nullable: true
          required: [url, thumbnail]
          additionalProperties: false
          properties:
            url: { type: string }
            thumbnail: { type: string, nullable: true }
        options:
          description: Empty for a product without choices
          type: array
          items: { $ref: '#/components/schemas/ProductOption' }
        availability: { $ref: '#/components/schemas/ProductAvailability' }
        quantityStep: { type: number, description: 'Allowed increment (1, or e.g. 0.5 for weighed products)' }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        summary:
          description: Short description
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RichText' }]
        description:
          description: Long description
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RichText' }]
        specifications:
          type: array
          items:
            type: object
            required: [name, value]
            additionalProperties: false
            properties:
              name: { type: string }
              value: { type: string }
        notices:
          description: Short texts to show near the price (promotion, payment offer)
          type: array
          items:
            type: object
            required: [kind, text]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [promotion, payment_offer, info] }
              text: { type: string }
        seo: { $ref: '#/components/schemas/Seo' }
    ProductDetailsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/ProductDetails' }

    ProductRecommendationsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [sections]
          additionalProperties: false
          properties:
            sections:
              type: array
              items:
                type: object
                required: [key, title, products, total]
                additionalProperties: false
                properties:
                  key: { type: string, enum: [related, similar, frequently_bought_together] }
                  title: { type: string }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
                  total:
                    description: Price of buying all of them together (frequently_bought_together only)
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/Money' }]

    ProductReviewsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [enabled, summary, items, pagination]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            summary:
              type: object
              nullable: true
              required: [average, count, distribution]
              additionalProperties: false
              properties:
                average: { type: number }
                count: { type: integer }
                distribution:
                  description: 5 stars first
                  type: array
                  items:
                    type: object
                    required: [stars, count, percent]
                    additionalProperties: false
                    properties:
                      stars: { type: integer, minimum: 1, maximum: 5 }
                      count: { type: integer, minimum: 0 }
                      percent: { type: integer, minimum: 0, maximum: 100 }
            items:
              type: array
              items:
                type: object
                required: [id, author, rating, comment, createdAt]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  author: { type: string, nullable: true, description: Null when the store hides names }
                  rating: { type: integer, minimum: 1, maximum: 5 }
                  comment: { type: string, nullable: true }
                  createdAt: { type: string, format: date-time }
            pagination: { $ref: '#/components/schemas/Pagination' }
            # added for the orders-extras phase (optional for older recordings; absent = writing is off)
            write:
              description: Whether and how the shopper may write a review (POST /reviews)
              type: object
              required: [enabled, requiresSignIn, requiresOrder, message]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                requiresSignIn: { type: boolean }
                requiresOrder: { type: boolean, description: 'Only shoppers who bought it, from the order page' }
                message: { type: string, nullable: true, description: 'Why it is not possible now, e.g. "Sign in to write a review"' }

    ListingFacet:
      description: One filter group. Links come ready from the backend (`query`).
      type: object
      required: [key, label, kind, display, values, range]
      additionalProperties: false
      properties:
        key: { type: string, example: brand }
        label: { type: string }
        kind: { type: string, enum: [options, range], description: 'options → `values`; range → `range`. Skip unknown kinds.' }
        display: { type: string, enum: [list, color, image], description: 'A hint for `values`' }
        values:
          type: array
          items:
            type: object
            required: [label, selected, count, color, image, query]
            additionalProperties: false
            properties:
              label: { type: string }
              selected: { type: boolean }
              count: { type: integer, nullable: true, description: Products with this value; null when not counted }
              color: { type: string, nullable: true }
              image: { type: string, nullable: true }
              query: { type: string, description: 'Filters after clicking this value (adds it, or removes it when selected)' }
        range:
          description: A from/to filter typed by the shopper. Send the two numbers as `priceMin` / `priceMax`, next to the parameters of `query`.
          type: object
          nullable: true
          required: [min, max, selectedMin, selectedMax, query]
          additionalProperties: false
          properties:
            min:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Money' }]
            max:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Money' }]
            selectedMin: { type: number, nullable: true }
            selectedMax: { type: number, nullable: true }
            query: { type: string, description: 'The other filters, without this range' }

    ProductListing:
      type: object
      required: [context, breadcrumbs, items, pagination, sort, facets, appliedFilters, clearFiltersQuery, seo]
      additionalProperties: false
      properties:
        context:
          type: object
          required: [type, title, description, image, query]
          additionalProperties: false
          properties:
            type: { type: string, enum: [all, category, brand, list, deals, tag, search] }
            title: { type: string, description: The page heading }
            description:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/RichText' }]
            image:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Image' }]
            query: { type: string, nullable: true, description: The search text (search only) }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/Link' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        sort:
          description: Sort choices in display order; exactly one is selected
          type: array
          items:
            type: object
            required: [label, selected, query]
            additionalProperties: false
            properties:
              label: { type: string }
              selected: { type: boolean }
              query: { type: string }
        facets:
          description: Empty when the store has filters switched off
          type: array
          items: { $ref: '#/components/schemas/ListingFacet' }
        appliedFilters:
          description: Chips for the filters in use
          type: array
          items:
            type: object
            required: [label, removeQuery]
            additionalProperties: false
            properties:
              label: { type: string }
              removeQuery: { type: string }
        clearFiltersQuery: { type: string, nullable: true, description: Null when no filter is in use }
        seo: { $ref: '#/components/schemas/Seo' }
    ProductListingResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/ProductListing' }

    SearchSuggestionsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [query, products, viewAll]
          additionalProperties: false
          properties:
            query: { type: string }
            products:
              type: array
              items: { $ref: '#/components/schemas/ProductCard' }
            viewAll: { $ref: '#/components/schemas/SearchTarget' }

    CategoryNode:
      type: object
      required: [id, name, image, target, children]
      additionalProperties: false
      properties:
        id: { type: string, description: Unique in the tree }
        name: { type: string }
        image:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Image' }]
        target: { $ref: '#/components/schemas/CategoryTarget' }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }
    CategoriesResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CategoryNode' }

    BrandsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items, pagination]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Tile' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    Resolution:
      type: object
      required: [result, target, url, permanent]
      additionalProperties: false
      properties:
        result: { type: string, enum: [target, redirect, gone, not_found] }
        target: { $ref: '#/components/schemas/NullableTarget' }
        url: { type: string, nullable: true, description: Where to redirect when it is not something the backend knows as a Target }
        permanent: { type: boolean, description: '301 when true, 302 when false' }
    ResolutionResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Resolution' }

    # ---------------------------------------------------------------- checkout and orders

    CheckoutSettings:
      type: object
      required: [guestCheckout, guestEmail, pickup, promoCode, orderNote, notice, addressForm]
      additionalProperties: false
      properties:
        guestCheckout: { type: boolean, description: False → a shopper must sign in before checkout }
        guestEmail: { type: string, enum: [required, optional, hidden] }
        pickup:
          type: object
          required: [enabled, label]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            label: { type: string, nullable: true }
        promoCode: { type: boolean }
        orderNote: { type: boolean }
        notice: { type: string, nullable: true, description: A text the merchant wants on the checkout page }
        addressForm:
          description: Draw the address form from this. Send the values back under the same names.
          type: object
          required: [levels, fields]
          additionalProperties: false
          properties:
            levels:
              description: Location pickers to show, in order
              type: array
              items: { type: string, enum: [city, area, district] }
            fields:
              description: Text inputs to show, in order (hidden fields are not listed)
              type: array
              items:
                type: object
                required: [name, label, required, kind]
                additionalProperties: false
                properties:
                  name: { type: string, example: street }
                  label: { type: string }
                  required: { type: boolean }
                  kind: { type: string, enum: [text, phone, email], description: 'Unknown values → text' }
    CheckoutSettingsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/CheckoutSettings' }

    NamedRef:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }

    Address:
      type: object
      required: [id, isDefault, city, area, district, values, formatted, deliverable]
      additionalProperties: false
      properties:
        id: { type: integer }
        isDefault: { type: boolean }
        city: { $ref: '#/components/schemas/NamedRef' }
        area:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/NamedRef' }]
        district:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/NamedRef' }]
        values:
          description: The text fields of CheckoutSettings.addressForm.fields, by name
          type: object
          additionalProperties: { type: string, nullable: true }
        formatted: { type: string, description: 'The whole address as one line, written by the backend' }
        deliverable: { type: boolean, description: False → the store does not deliver there now }
    AddressInput:
      type: object
      required: [cityId, values]
      additionalProperties: false
      properties:
        cityId: { type: integer, minimum: 1 }
        areaId: { type: integer, minimum: 1, nullable: true }
        districtId: { type: integer, minimum: 1, nullable: true }
        isDefault: { type: boolean }
        values:
          type: object
          additionalProperties: { type: string, nullable: true }
    AddressesResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Address' }
    AddressSavedResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [address, items]
          additionalProperties: false
          properties:
            address: { $ref: '#/components/schemas/Address' }
            items:
              type: array
              items: { $ref: '#/components/schemas/Address' }

    LocationsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [cities]
          additionalProperties: false
          properties:
            cities:
              type: array
              items:
                type: object
                required: [id, name, areas]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  name: { type: string }
                  areas:
                    type: array
                    items:
                      type: object
                      required: [id, name, districts]
                      additionalProperties: false
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        districts:
                          type: array
                          items: { $ref: '#/components/schemas/NamedRef' }

    PickupBranch:
      type: object
      required: [id, name, address, phone, mapUrl]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        mapUrl: { type: string, nullable: true }
    PickupBranchesResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PickupBranch' }

    UploadedFile:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, description: 'Send it in `prescriptionFiles`' }
        name: { type: string }

    CheckoutSelections:
      description: What the shopper has chosen so far. Everything is optional. No prices.
      type: object
      additionalProperties: false
      properties:
        fulfilment: { type: string, enum: [delivery, pickup], nullable: true }
        addressId: { type: integer, nullable: true, description: For delivery }
        branchId: { type: integer, nullable: true, description: For pickup }
        paymentMethodId: { type: integer, nullable: true }
        installmentPlanId: { type: integer, nullable: true }
        promoCode: { type: string, maxLength: 100, nullable: true }
        note: { type: string, maxLength: 1000, nullable: true }
        prescriptionFiles:
          type: array
          maxItems: 10
          items: { type: string }
        acceptPaymentChange: { type: boolean, description: 'Send true after the shopper accepted a `payment_change_needs_consent` answer' }

    CheckoutContact:
      type: object
      required: [isGuest, name, phone, email]
      additionalProperties: false
      properties:
        isGuest: { type: boolean }
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }

    TotalLine:
      description: One row of a price breakdown. Show `label` and `amount.display` (or `text`). Discounts are negative and their text already has the minus sign.
      type: object
      required: [kind, label, amount, text]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [subtotal, promotion_discount, promo_code, delivery, payment_fee, other], description: 'For styling only; unknown values → other' }
        label: { type: string }
        amount:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        text: { type: string, nullable: true, description: 'Shown instead of an amount, e.g. "Free" or "Confirmed by phone"' }

    CheckoutNotice:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string }
        message: { type: string }

    Checkout:
      description: Everything the checkout page shows, computed by the backend for the choices sent.
      type: object
      required: [cart, contact, fulfilment, payment, promo, requirements, totals, minimumOrder, missing, blockers, messages, canPlaceOrder]
      additionalProperties: false
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        contact: { $ref: '#/components/schemas/CheckoutContact' }
        fulfilment:
          type: object
          required: [options, selected, addresses, addressId, branch, delivery]
          additionalProperties: false
          properties:
            options:
              description: Ways to get the order, in display order
              type: array
              items:
                type: object
                required: [type, label, available, reason]
                additionalProperties: false
                properties:
                  type: { type: string, enum: [delivery, pickup] }
                  label: { type: string }
                  available: { type: boolean }
                  reason: { type: string, nullable: true, description: Why it is not available }
            selected: { type: string, enum: [delivery, pickup], nullable: true }
            addresses:
              description: The shopper's address book
              type: array
              items: { $ref: '#/components/schemas/Address' }
            addressId: { type: integer, nullable: true, description: The chosen address }
            branch:
              description: The chosen pickup branch
              nullable: true
              allOf: [{ $ref: '#/components/schemas/PickupBranch' }]
            delivery:
              description: Null until the backend can price the delivery (an address or branch is chosen)
              type: object
              nullable: true
              required: [fee, text, free]
              additionalProperties: false
              properties:
                fee:
                  nullable: true
                  allOf: [{ $ref: '#/components/schemas/Money' }]
                text: { type: string, nullable: true, description: 'Shown instead of a fee, e.g. "Confirmed by phone"' }
                free: { type: boolean }
        payment:
          type: object
          required: [methods, selected]
          additionalProperties: false
          properties:
            methods:
              description: Methods offered for this cart and these choices, in display order
              type: array
              items:
                type: object
                required: [id, name, icon, online, fee, note, plans]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  name: { type: string }
                  icon: { type: string, nullable: true }
                  online: { type: boolean, description: True → the shopper pays on a payment page after placing the order }
                  fee:
                    description: Extra fee (or discount, negative) of this method for this checkout
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/Money' }]
                  note: { type: string, nullable: true }
                  plans:
                    description: Installment plans; when not empty the shopper must pick one
                    type: array
                    items: { $ref: '#/components/schemas/NamedRef' }
            selected:
              type: object
              nullable: true
              required: [methodId, planId]
              additionalProperties: false
              properties:
                methodId: { type: integer }
                planId: { type: integer, nullable: true }
        promo:
          type: object
          required: [code, applied, message]
          additionalProperties: false
          properties:
            code: { type: string, nullable: true, description: The code that was sent }
            applied: { type: boolean }
            message: { type: string, nullable: true, description: 'Why the code was refused, or a hint about what it changed' }
        requirements:
          type: object
          required: [prescription]
          additionalProperties: false
          properties:
            prescription:
              type: object
              required: [required, files]
              additionalProperties: false
              properties:
                required: { type: boolean }
                files:
                  type: array
                  items: { $ref: '#/components/schemas/UploadedFile' }
        totals:
          type: object
          required: [lines, total]
          additionalProperties: false
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/TotalLine' }
            total:
              description: What the shopper pays. Show it, and send its `amount` back as `expectedTotal`.
              allOf: [{ $ref: '#/components/schemas/Money' }]
        minimumOrder:
          description: Null when the store has no minimum
          type: object
          nullable: true
          required: [amount, remaining, progressPercent]
          additionalProperties: false
          properties:
            amount: { $ref: '#/components/schemas/Money' }
            remaining: { $ref: '#/components/schemas/Money' }
            progressPercent: { type: integer, minimum: 0, maximum: 100 }
        missing:
          description: |
            What the shopper still has to choose or fill. Codes: `sign_in`, `contact`, `fulfilment`, `address`,
            `branch`, `payment_method`, `installment_plan`, `prescription`. Show `message` for codes you don't know.
          type: array
          items: { $ref: '#/components/schemas/CheckoutNotice' }
        blockers:
          description: |
            Why the order can't be placed even with every field filled. Codes: `empty_cart`, `unavailable_items`,
            `minimum_order`, `guest_checkout_disabled`, `account_not_approved`, `not_deliverable`, `pickup_only_items`,
            `no_payment_method`, `promo_invalid`, `not_supported`. Show `message`.
          type: array
          items: { $ref: '#/components/schemas/CheckoutNotice' }
        messages:
          description: Things that changed and the shopper should know (a dropped choice, a changed price)
          type: array
          items:
            type: object
            required: [level, text]
            additionalProperties: false
            properties:
              level: { type: string, enum: [info, warning] }
              text: { type: string }
        canPlaceOrder: { type: boolean, description: 'Enable the "place order" button only when true' }
    CheckoutResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Checkout' }

    PlaceOrderRequest:
      type: object
      required: [selections, expectedTotal, acceptTerms]
      additionalProperties: false
      properties:
        selections: { $ref: '#/components/schemas/CheckoutSelections' }
        expectedTotal: { type: number, description: '`totals.total.amount` of the checkout the shopper saw' }
        acceptTerms: { type: boolean, enum: [true] }
        returnUrl:
          description: |
            A page of this storefront (absolute https URL on an origin the store allows). Needed for online
            payment methods: after paying, the shopper lands there with `?checkout=<reference>` added.
          type: string
          maxLength: 2000
          nullable: true
    PlaceOrderResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [next, order]
          additionalProperties: false
          properties:
            next:
              description: |
                `done` → the order exists; go to the result page with `reference`.
                `redirect` → send the shopper to `url` (the payment page); they come back to `returnUrl`.
              type: object
              required: [type, url, reference]
              additionalProperties: false
              properties:
                type: { type: string, enum: [done, redirect] }
                url: { type: string, nullable: true }
                reference: { type: string, description: For GET /checkout/result }
            order:
              description: Set when `next.type` is done
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Order' }]

    CheckoutResultResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [status, message, order, retry]
          additionalProperties: false
          properties:
            status:
              description: placed = order created, pay later. paid = paid online and order created. pending = the bank has not answered yet (ask again in a few seconds). failed / cancelled = no order.
              type: string
              enum: [placed, paid, pending, failed, cancelled]
            message: { type: string, nullable: true, description: 'Localized text for the shopper, written by the backend' }
            order:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/Order' }]
            retry: { type: boolean, description: True → the cart is still there and the shopper can go back to checkout }

    OrderStatus:
      type: object
      required: [code, label, active]
      additionalProperties: false
      properties:
        code: { type: string, example: processing, description: 'For styling; show `label`' }
        label: { type: string }
        active: { type: boolean, description: 'Still on its way (not delivered, cancelled or returned)' }

    OrderSummary:
      type: object
      required: [id, number, placedAt, status, itemCount, total]
      additionalProperties: false
      properties:
        id: { type: string, description: 'The id for URLs and for GET /orders/{orderId}' }
        number: { type: string, description: 'What the shopper calls the order, e.g. "48213"' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        itemCount: { type: number, minimum: 0 }
        total: { $ref: '#/components/schemas/Money' }
    OrdersResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items, pagination]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderSummary' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    Order:
      type: object
      required: [id, number, placedAt, status, timeline, fulfilment, payment, items, totals, note, actions]
      additionalProperties: false
      properties:
        id: { type: string }
        number: { type: string }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        timeline:
          description: The steps of this order, in order; empty when the store shows none
          type: array
          items:
            type: object
            required: [label, done, current]
            additionalProperties: false
            properties:
              label: { type: string }
              done: { type: boolean }
              current: { type: boolean }
        fulfilment:
          type: object
          required: [type, address, branch]
          additionalProperties: false
          properties:
            type: { type: string, enum: [delivery, pickup] }
            address: { type: string, nullable: true, description: The delivery address as one line }
            branch:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/PickupBranch' }]
        payment:
          type: object
          required: [method, online]
          additionalProperties: false
          properties:
            method: { type: string, nullable: true }
            online: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [name, image, target, quantity, lineTotal, compareAt]
            additionalProperties: false
            properties:
              name: { type: string }
              image:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/Image' }]
              target:
                description: Null when the product no longer exists
                nullable: true
                allOf: [{ $ref: '#/components/schemas/ProductTarget' }]
              # added for the orders-extras phase (optional for older recordings): the variant, for item ratings and reviews
              productId: { type: integer, nullable: true, description: 'ProductCard.id of the variant; null when the product no longer exists' }
              quantity: { type: number }
              lineTotal: { $ref: '#/components/schemas/Money' }
              compareAt:
                description: The line's price before discount; null when not discounted
                nullable: true
                allOf: [{ $ref: '#/components/schemas/Money' }]
        totals:
          type: object
          required: [lines, total]
          additionalProperties: false
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/TotalLine' }
            total: { $ref: '#/components/schemas/Money' }
        note: { type: string, nullable: true }
        actions:
          description: What the shopper may do now, decided by the backend
          type: object
          required: [canCancel, canReorder]
          additionalProperties: false
          properties:
            canCancel: { type: boolean }
            canReorder: { type: boolean }
            # added for the orders-extras phase (optional for older recordings; absent = false)
            canRate: { type: boolean, description: 'Delivered, not rated yet, store has order rating on' }
            canReviewProducts: { type: boolean, description: Delivered and the store takes product reviews }
        # added for the orders-extras phase (optional for older recordings)
        rating:
          description: The rating the shopper gave; null when not rated (or skipped)
          type: object
          nullable: true
          required: [rating, driverRating, feedback]
          additionalProperties: false
          properties:
            rating: { type: integer, minimum: 1, maximum: 5 }
            driverRating: { type: integer, nullable: true, minimum: 1, maximum: 5 }
            feedback: { type: string, nullable: true }
        ratingForm:
          description: How to draw the rating dialog; null when `actions.canRate` is false
          type: object
          nullable: true
          required: [driverRating, items]
          additionalProperties: false
          properties:
            driverRating: { type: string, enum: [hidden, optional, required] }
            items: { type: boolean, description: Also rate each product }
        phone: { type: string, nullable: true, description: 'The phone the order was placed with, masked (for the tracking page)' }
    OrderResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Order' }

    CancellationReasonsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, text]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  text: { type: string }

    ReorderResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [cart, skipped]
          additionalProperties: false
          properties:
            cart: { $ref: '#/components/schemas/Cart' }
            skipped:
              type: array
              items:
                type: object
                required: [name, reason]
                additionalProperties: false
                properties:
                  name: { type: string }
                  reason: { type: string, description: Localized }

    # ---------------------------------------------------------------- shared (phase: shell, auth, content)

    MessageResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [message]
          additionalProperties: false
          properties:
            message: { type: string, description: 'Localized, safe to show' }

    # ---------------------------------------------------------------- auth

    Customer:
      description: The signed-in customer as the storefront may show it. Never contains a token.
      type: object
      required: [id, firstName, lastName, email, phone, phoneVerified, birthdate, image, approval]
      additionalProperties: false
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        phoneVerified: { type: boolean }
        birthdate: { type: string, nullable: true, description: 'YYYY-MM-DD' }
        image: { type: string, nullable: true }
        approval:
          description: Null when the store does not approve customers by hand
          type: object
          nullable: true
          required: [status, notes]
          additionalProperties: false
          properties:
            status: { type: string, enum: [pending, approved, rejected] }
            notes: { type: string, nullable: true, description: The merchant's note to the customer }
        referralCode: { type: string, nullable: true, description: The customer's own code to share (null when the store has no referrals) }
    CustomerResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Customer' }

    Session:
      type: object
      required: [token, customer, next]
      additionalProperties: false
      properties:
        token: { type: string, description: 'Send as Authorization: Bearer <token>. Keep it server-side (httpOnly cookie).' }
        customer: { $ref: '#/components/schemas/Customer' }
        next:
          description: |
            What the storefront must do next: `verify_phone` (show the SMS code page; shopping is allowed meanwhile),
            `waiting_approval` (the store approves accounts by hand: show the waiting page, no shopping),
            `complete_profile` (social sign-in without a phone: ask for name and phone), or null.
          type: string
          nullable: true
          enum: [verify_phone, waiting_approval, complete_profile, null]
    SessionResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Session' }
    SignedOutResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [signedOut]
          additionalProperties: false
          properties:
            signedOut: { type: boolean, enum: [true] }
    CodeSentResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [message, destination, expiresInSeconds, codeLength]
          additionalProperties: false
          properties:
            message: { type: string }
            destination: { type: string, nullable: true, description: 'Masked phone or e-mail, e.g. 01•••••123' }
            expiresInSeconds: { type: integer, nullable: true }
            codeLength: { type: integer, nullable: true }

    FormField:
      description: One input of a backend-described form. Send the value back under `name`.
      type: object
      required: [name, label, kind, required, placeholder, options, multiple]
      additionalProperties: false
      properties:
        name: { type: string }
        label: { type: string }
        kind: { type: string, enum: [text, email, phone, password, date, textarea, select, file, checkbox], description: 'Unknown values → text' }
        required: { type: boolean }
        placeholder: { type: string, nullable: true }
        options:
          description: For `select`
          type: array
          items:
            type: object
            required: [value, label, selected]
            additionalProperties: false
            properties:
              value: { type: string }
              label: { type: string }
              selected: { type: boolean }
        multiple: { type: boolean, description: For `select` and `file` }
        hint: { type: string, nullable: true }
        maxLength: { type: integer, nullable: true }

    AuthSettings:
      type: object
      required: [loginMethod, signup, otpLogin, passwordReset, social, phone, verifyPhoneAfterSignup, approval]
      additionalProperties: false
      properties:
        loginMethod: { type: string, enum: [email, phone], description: The identifier field of the sign-in form }
        signup:
          type: object
          required: [enabled, fields]
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            fields:
              description: The sign-up form, in order (hidden fields are not listed). Password confirmation is the storefront's.
              type: array
              items: { $ref: '#/components/schemas/FormField' }
        otpLogin: { type: boolean, description: Sign in with an SMS code instead of a password }
        passwordReset:
          type: object
          required: [method]
          additionalProperties: false
          properties:
            method: { type: string, enum: [sms, email, none], description: 'sms → code + new password; email → link with a token; none → no reset' }
        social:
          description: Providers the store offers, with the public client ids the browser SDKs need
          type: object
          required: [google, facebook, apple]
          additionalProperties: false
          properties:
            google:
              type: object
              nullable: true
              required: [clientId]
              additionalProperties: false
              properties:
                clientId: { type: string }
            facebook:
              type: object
              nullable: true
              required: [appId]
              additionalProperties: false
              properties:
                appId: { type: string }
            apple:
              type: object
              nullable: true
              required: [clientId]
              additionalProperties: false
              properties:
                clientId: { type: string }
        phone:
          type: object
          required: [prefix, length, example]
          additionalProperties: false
          properties:
            prefix: { type: string, nullable: true, example: '+20' }
            length: { type: integer, nullable: true }
            example: { type: string, nullable: true }
        verifyPhoneAfterSignup: { type: boolean }
        approval:
          type: object
          required: [required, waitingText]
          additionalProperties: false
          properties:
            required: { type: boolean, description: New accounts wait for the merchant's approval }
            waitingText: { type: string, nullable: true }
    AuthSettingsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/AuthSettings' }

    SignInRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier: { type: string, description: 'E-mail or phone, as `AuthSettings.loginMethod` says' }
        password: { type: string }
    SignUpRequest:
      description: Values keyed by `AuthSettings.signup.fields[].name` (firstName, lastName, phone, email, password, birthdate, referralCode...)
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          additionalProperties: { type: string }
    SocialSignInRequest:
      type: object
      required: [provider, token]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [google, facebook, apple] }
        token: { type: string, description: 'Google id/access token, Facebook access token or Apple identity token' }
        name: { type: string, nullable: true, description: Apple only gives the name once; pass it on the first sign-in }
    CompleteProfileRequest:
      type: object
      required: [firstName, lastName, phone]
      additionalProperties: false
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        birthdate: { type: string, nullable: true }
    ForgotPasswordRequest:
      type: object
      required: [identifier]
      additionalProperties: false
      properties:
        identifier: { type: string, description: 'E-mail or phone, as `AuthSettings.loginMethod` says' }
        resetUrl:
          type: string
          nullable: true
          description: |
            E-mail method only: the storefront's reset page; the backend appends `?token=<token>&email=<email>`.
            Its origin must be allowed (`STOREFRONT_RETURN_ORIGINS`), otherwise 422.
    ForgotPasswordResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [method, message, destination]
          additionalProperties: false
          properties:
            method: { type: string, enum: [sms, email] }
            message: { type: string }
            destination: { type: string, nullable: true, description: Masked phone or e-mail }
    ResetPasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 8 }
        phone: { type: string, nullable: true, description: SMS method }
        code: { type: string, nullable: true, description: SMS method }
        token: { type: string, nullable: true, description: E-mail method }

    # ---------------------------------------------------------------- account

    ProfileResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [customer, fields, next]
          additionalProperties: false
          properties:
            customer: { $ref: '#/components/schemas/Customer' }
            fields:
              description: The profile form, in order, with the current values (hidden fields are not listed)
              type: array
              items: { $ref: '#/components/schemas/ProfileField' }
            next:
              type: string
              nullable: true
              enum: [verify_phone, verify_email, null]
              description: After a save; `verify_email` = a confirmation link was e-mailed to the new address
    ProfileField:
      description: A FormField with the customer's current value and whether it may be changed
      type: object
      required: [name, label, kind, required, placeholder, options, multiple, value, editable]
      additionalProperties: false
      properties:
        name: { type: string }
        label: { type: string }
        kind: { type: string, enum: [text, email, phone, password, date, textarea, select, file, checkbox], description: 'Unknown values → text' }
        required: { type: boolean }
        placeholder: { type: string, nullable: true }
        options:
          type: array
          items:
            type: object
            required: [value, label, selected]
            additionalProperties: false
            properties:
              value: { type: string }
              label: { type: string }
              selected: { type: boolean }
        multiple: { type: boolean }
        hint: { type: string, nullable: true }
        maxLength: { type: integer, nullable: true }
        value: { type: string, nullable: true }
        editable: { type: boolean }
    ProfileInput:
      description: Values keyed by `ProfileResponse.fields[].name`
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          additionalProperties: { type: string, nullable: true }

    # ---------------------------------------------------------------- seo + marketing

    Breadcrumb:
      type: object
      required: [label, target]
      additionalProperties: false
      properties:
        label: { type: string }
        target: { $ref: '#/components/schemas/NullableTarget' }

    StructuredData:
      description: |
        Facts for the page's JSON-LD, decided by the backend. The storefront serializes them (adding its own
        URLs from the Targets) and never invents values. Every member is optional; unknown members are skipped.
      type: object
      additionalProperties: false
      properties:
        product:
          type: object
          required: [schemaType, name, description, sku, brand, images, price, currency, availability, rating, category]
          additionalProperties: false
          properties:
            schemaType: { type: string, description: 'schema.org type, e.g. Product, Drug (merchant setting per category)' }
            name: { type: string }
            description: { type: string, nullable: true }
            sku: { type: string, nullable: true }
            gtin: { type: string, nullable: true }
            brand: { type: string, nullable: true }
            images:
              type: array
              items: { type: string }
            price: { type: number, nullable: true, description: For the Offer only; never shown }
            currency: { type: string, nullable: true }
            availability: { type: string, enum: [in_stock, out_of_stock, preorder, discontinued] }
            rating:
              type: object
              nullable: true
              required: [average, count]
              additionalProperties: false
              properties:
                average: { type: number }
                count: { type: integer }
            category: { type: string, nullable: true }
        collection:
          description: Listing / category / brand pages
          type: object
          required: [name, description, items]
          additionalProperties: false
          properties:
            name: { type: string }
            description: { type: string, nullable: true }
            items:
              type: array
              items:
                type: object
                required: [name, target, image]
                additionalProperties: false
                properties:
                  name: { type: string }
                  target: { $ref: '#/components/schemas/Target' }
                  image: { type: string, nullable: true }
        webPage:
          type: object
          required: [schemaType, name, description]
          additionalProperties: false
          properties:
            schemaType: { type: string, description: 'WebPage, ContactPage, AboutPage, CollectionPage...' }
            name: { type: string }
            description: { type: string, nullable: true }
            about:
              type: array
              items: { type: string }

    SiteSeo:
      type: object
      required: [organization, localBusiness, website, verification, robots]
      additionalProperties: false
      properties:
        organization:
          type: object
          required: [name, legalName, logo, sameAs, telephone, email, address]
          additionalProperties: false
          properties:
            name: { type: string }
            legalName: { type: string, nullable: true }
            logo: { type: string, nullable: true }
            sameAs:
              type: array
              items: { type: string }
            telephone: { type: string, nullable: true }
            email: { type: string, nullable: true }
            address: { $ref: '#/components/schemas/PostalAddress' }
        localBusiness:
          description: Null when the store has no physical presence configured
          type: object
          nullable: true
          required: [schemaType, name, images, telephone, address, geo, openingHours, priceRange]
          additionalProperties: false
          properties:
            schemaType: { type: string, example: Pharmacy }
            name: { type: string }
            images:
              type: array
              items: { type: string }
            telephone: { type: string, nullable: true }
            address: { $ref: '#/components/schemas/PostalAddress' }
            geo:
              type: object
              nullable: true
              required: [latitude, longitude]
              additionalProperties: false
              properties:
                latitude: { type: number }
                longitude: { type: number }
            openingHours:
              type: array
              items:
                type: object
                required: [days, opens, closes]
                additionalProperties: false
                properties:
                  days:
                    type: array
                    items: { type: string, enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday] }
                  opens: { type: string, example: '09:00' }
                  closes: { type: string, example: '22:00' }
            priceRange: { type: string, nullable: true }
        website:
          type: object
          required: [name, searchable]
          additionalProperties: false
          properties:
            name: { type: string }
            searchable: { type: boolean, description: Add a SearchAction pointing at the search page }
        verification:
          type: object
          required: [google]
          additionalProperties: false
          properties:
            google: { type: string, nullable: true, description: google-site-verification meta content }
        robots:
          type: object
          required: [index]
          additionalProperties: false
          properties:
            index: { type: boolean, description: 'False → the whole site is noindex (staging, hidden stores)' }
    PostalAddress:
      type: object
      nullable: true
      required: [street, locality, region, postalCode, country]
      additionalProperties: false
      properties:
        street: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        region: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        country: { type: string, nullable: true, description: ISO code }
    SiteSeoResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/SiteSeo' }

    SitemapResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items, pagination]
          additionalProperties: false
          properties:
            items:
              type: array
              items:
                type: object
                required: [target, updatedAt, alternates]
                additionalProperties: false
                properties:
                  target: { $ref: '#/components/schemas/Target' }
                  updatedAt: { type: string, format: date-time, nullable: true }
                  alternates:
                    type: array
                    items:
                      type: object
                      required: [locale, target]
                      additionalProperties: false
                      properties:
                        locale: { $ref: '#/components/schemas/Locale' }
                        target: { $ref: '#/components/schemas/Target' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    Marketing:
      description: Tag and pixel ids the merchant configured. Null members are not installed.
      type: object
      required: [gtmId, googleAnalyticsIds, googleAds, facebookPixelId, tiktokPixelId, snapchatPixelId, clarityId, hotjarId]
      additionalProperties: false
      properties:
        gtmId: { type: string, nullable: true }
        googleAnalyticsIds:
          type: array
          items: { type: string }
        googleAds:
          type: object
          nullable: true
          required: [conversionId, labels]
          additionalProperties: false
          properties:
            conversionId: { type: string }
            labels:
              description: Conversion labels by event name (purchase, add_to_cart, view_item, sign_up)
              type: object
              additionalProperties: { type: string }
        facebookPixelId: { type: string, nullable: true }
        tiktokPixelId: { type: string, nullable: true }
        snapchatPixelId: { type: string, nullable: true }
        clarityId: { type: string, nullable: true }
        hotjarId: { type: string, nullable: true }

    EventRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          enum: [page_view, view_item, view_item_list, search, add_to_cart, remove_from_cart, view_cart, begin_checkout, add_shipping_info, add_payment_info, purchase, sign_up, login, add_to_wishlist, select_promotion]
        eventId: { type: string, nullable: true, description: 'Same id given to the browser pixel, for de-duplication' }
        page:
          type: object
          nullable: true
          required: [path]
          additionalProperties: false
          properties:
            path: { type: string }
            referrer: { type: string, nullable: true }
        clickIds:
          description: Campaign click ids from the landing URL, kept by the storefront for the session
          type: object
          nullable: true
          additionalProperties: false
          properties:
            fbclid: { type: string, nullable: true }
            gclid: { type: string, nullable: true }
            ttclid: { type: string, nullable: true }
            sccid: { type: string, nullable: true }
        browser:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            fbp: { type: string, nullable: true }
            fbc: { type: string, nullable: true }
        productIds:
          description: The products the event is about (the backend looks up names and prices itself)
          type: array
          items: { type: integer }
        orderId: { type: string, nullable: true, description: For purchase (Order.id) }
        searchTerm: { type: string, nullable: true }
    EventAcceptedResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [accepted]
          additionalProperties: false
          properties:
            accepted: { type: boolean }

    # ---------------------------------------------------------------- content

    Page:
      type: object
      required: [slug, title, showTitle, kind, content, iframeUrl, seo]
      additionalProperties: false
      properties:
        slug: { type: string }
        title: { type: string }
        showTitle: { type: boolean }
        kind:
          type: string
          enum: [content, contact, branches]
          description: 'contact → also draw the contact form (POST /contact) and the store contact details; branches → draw GET /branches. Unknown values → content.'
        content:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RichText' }]
        iframeUrl: { type: string, nullable: true, description: Some pages embed an external page }
        seo: { $ref: '#/components/schemas/Seo' }
        contact:
          description: Only for `kind = contact`
          type: object
          nullable: true
          required: [hotline, email, address, whatsapp, fields]
          additionalProperties: false
          properties:
            hotline: { type: string, nullable: true }
            email: { type: string, nullable: true }
            address: { type: string, nullable: true }
            whatsapp: { type: string, nullable: true }
            fields:
              type: array
              items: { $ref: '#/components/schemas/FormField' }
    PageResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Page' }

    Branch:
      type: object
      required: [id, name, address, area, phone, email, image, mapUrl, location]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string, nullable: true }
        area: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        image: { type: string, nullable: true }
        mapUrl: { type: string, nullable: true }
        location:
          type: object
          nullable: true
          required: [latitude, longitude]
          additionalProperties: false
          properties:
            latitude: { type: number }
            longitude: { type: number }
    BranchesResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [groups]
          additionalProperties: false
          properties:
            groups:
              type: array
              items:
                type: object
                required: [name, branches]
                additionalProperties: false
                properties:
                  name: { type: string }
                  branches:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }

    ContactRequest:
      description: Values keyed by `Page.contact.fields[].name` (name, phone, email, subject, message)
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          additionalProperties: { type: string }

    LandingPage:
      type: object
      required: [slug, title, seo, promoBanners, sections]
      additionalProperties: false
      properties:
        slug: { type: string }
        title: { type: string, nullable: true }
        seo: { $ref: '#/components/schemas/Seo' }
        promoBanners:
          type: array
          items: { $ref: '#/components/schemas/PromoBanner' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }
    LandingPageResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/LandingPage' }

    Form:
      type: object
      required: [slug, title, showTitle, submitLabel, requiresSignIn, fields, seo]
      additionalProperties: false
      properties:
        slug: { type: string }
        title: { type: string }
        showTitle: { type: boolean }
        submitLabel: { type: string }
        requiresSignIn: { type: boolean, description: True → show a sign-in prompt instead of the form for visitors without a session }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FormField' }
        seo: { $ref: '#/components/schemas/Seo' }
    FormResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Form' }
    FormSubmission:
      description: Values keyed by `Form.fields[].name`; a multi-select sends an array; a file sends the id from POST /uploads
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }

    # ---------------------------------------------------------------- orders: rating, reviews

    RateOrderRequest:
      type: object
      required: [rating]
      additionalProperties: false
      properties:
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true, description: Null with `skip = true` }
        driverRating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        feedback: { type: string, nullable: true }
        skip: { type: boolean, default: false, description: The shopper dismissed the rating }
        items:
          type: array
          items:
            type: object
            required: [productId, rating]
            additionalProperties: false
            properties:
              productId: { type: integer }
              rating: { type: integer, minimum: 1, maximum: 5 }
              comment: { type: string, nullable: true }
    WriteReviewRequest:
      type: object
      required: [productId, rating, comment]
      additionalProperties: false
      properties:
        productId: { type: integer, description: ProductCard.id (the variant) }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 1 }
        orderId: { type: string, nullable: true, description: Required when `ProductReviewsResponse.data.write.requiresOrder` }

    # ---------------------------------------------------------------- shell

    MobileNavItem:
      type: object
      required: [id, label, icon, target, badge]
      additionalProperties: false
      properties:
        id: { type: string, description: 'home, categories, deals, all_products, cart, wishlist, compare, orders, notifications, prescriptions, points, area, account, language, more, or a merchant button' }
        label: { type: string }
        icon: { type: string, nullable: true, description: An icon name (hint) or an image URL }
        target: { $ref: '#/components/schemas/NullableTarget' }
        badge: { type: string, nullable: true, enum: [cart, wishlist, compare, notifications, null], description: Which `Me.counts` value to show on it }

    # ---------------------------------------------------------------- account extras: prescriptions

    PrescriptionForm:
      type: object
      required: [title, description, video, fields, addresses, blockers, canSend]
      additionalProperties: false
      properties:
        title: { type: string, description: "The store's word for a prescription, as the page heading" }
        description:
          description: Merchant text above the form
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RichText' }]
        video:
          description: A how-to video the merchant set (play it or link it; null = none)
          type: object
          nullable: true
          required: [url]
          additionalProperties: false
          properties:
            url: { type: string }
        fields:
          description: 'The inputs in order (`type`, `prescriptionNumber`, `files`, `note`). `files` has kind `file`: send the ids POST /uploads returned.'
          type: array
          items: { $ref: '#/components/schemas/FormField' }
        addresses:
          description: "The customer's addresses to send it to (the default first and preselected). Empty = add one first (`blockers`)."
          type: array
          items: { $ref: '#/components/schemas/PrescriptionAddressChoice' }
        blockers:
          description: 'What must happen before sending. The storefront shows `message` and offers the step: `add_address` (its add-address page), `add_phone` (the profile page), `verify_phone` (the phone verification page).'
          type: array
          items:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
              code: { type: string, enum: [add_address, add_phone, verify_phone] }
              message: { type: string }
        canSend: { type: boolean, description: True when `blockers` is empty }
    PrescriptionAddressChoice:
      type: object
      required: [id, label, selected]
      additionalProperties: false
      properties:
        id: { type: integer }
        label: { type: string, description: 'The address as one line, in the request language' }
        selected: { type: boolean }
    PrescriptionFormResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/PrescriptionForm' }
    PrescriptionRequest:
      type: object
      required: [addressId, files]
      additionalProperties: false
      properties:
        addressId: { type: integer, description: 'One of `PrescriptionForm.addresses`' }
        type: { type: string, nullable: true, description: 'One of the `type` field options (absent when the form has no `type` field)' }
        prescriptionNumber: { type: string, nullable: true, maxLength: 100 }
        files:
          description: Ids from POST /uploads (at most 10)
          type: array
          maxItems: 10
          items: { type: string }
        note: { type: string, nullable: true, maxLength: 1000 }
    Prescription:
      type: object
      required: [id, reference, status, placedAt, type, prescriptionNumber, note, fileCount, address, cancellation, actions]
      additionalProperties: false
      properties:
        id: { type: string }
        reference: { type: string, description: 'What the customer and the store call it, e.g. #1042' }
        status:
          type: object
          required: [code, label]
          additionalProperties: false
          properties:
            code: { type: string, enum: [received, in_progress, delivered, cancelled, unknown], description: 'unknown = a status this API does not know yet (show `label`)' }
            label: { type: string }
        placedAt: { type: string, format: date-time }
        type: { type: string, nullable: true, description: 'Label of the kind (e.g. Cash / Wasfaty); null when the store offers one kind only' }
        prescriptionNumber: { type: string, nullable: true }
        note: { type: string, nullable: true }
        fileCount: { type: integer, minimum: 0 }
        address: { type: string, nullable: true, description: The delivery address as one line }
        cancellation:
          description: 'Why it was cancelled, when the customer cancelled it (null otherwise: a store cancellation is not explained)'
          type: object
          nullable: true
          required: [reason, note]
          additionalProperties: false
          properties:
            reason: { type: string, nullable: true }
            note: { type: string, nullable: true }
        actions:
          type: object
          required: [canCancel]
          additionalProperties: false
          properties:
            canCancel: { type: boolean }
    PrescriptionResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/Prescription' }
    PrescriptionSentResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [prescription, message]
          additionalProperties: false
          properties:
            prescription: { $ref: '#/components/schemas/Prescription' }
            message: { type: string, description: Thank-you text to show }
    PrescriptionsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items, pagination]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Prescription' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    # ---------------------------------------------------------------- account extras: loyalty

    LoyaltyPoints:
      description: 'A number of points with ready-to-show text (points are not money: no `display`, never drawn as Money). Show `text`; `amount` is for analytics only.'
      type: object
      required: [amount, text]
      additionalProperties: false
      properties:
        amount: { type: number }
        text: { type: string, description: 'e.g. "1,250 points", "+120 points", "-500 points"' }
    LoyaltyBlocker:
      description: 'What the customer must do before redeeming: `add_phone` (the profile page) or `verify_phone` (the phone verification page).'
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string, enum: [add_phone, verify_phone] }
        message: { type: string }
    LoyaltySummary:
      type: object
      required: [provider, title, description, points, value, storeCredit, tier, pending, expiring, sections]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [elDokan, ivend] }
        title: { type: string }
        description:
          description: Merchant text about the programme
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RichText' }]
        points: { $ref: '#/components/schemas/LoyaltyPoints' }
        value:
          description: 'What the points are worth at checkout (iVend); null when points are spent on rewards instead'
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        storeCredit:
          description: Store credit (iVend); null when none
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        tier:
          description: 'Gold membership (El Dokan, when the store has a Gold level); null otherwise'
          type: object
          nullable: true
          required: [gold, label, message]
          additionalProperties: false
          properties:
            gold: { type: boolean }
            label: { type: string }
            message: { type: string, nullable: true, description: How to reach Gold (null when Gold) }
        pending: { type: string, nullable: true, description: 'Points earned but not usable yet, as a sentence' }
        expiring: { type: string, nullable: true, description: 'Points that expire at the next expiry date, as a sentence' }
        sections:
          description: Which loyalty pages exist for this store
          type: object
          required: [rewards, history, referral]
          additionalProperties: false
          properties:
            rewards: { type: boolean }
            history: { type: boolean }
            referral: { type: boolean }
    LoyaltySummaryResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/LoyaltySummary' }
    LoyaltyReward:
      type: object
      required: [id, name, description, image, kind, benefit, cost, badge, canRedeem, reason]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        image: { type: string, nullable: true }
        kind: { type: string, enum: [voucher, gift], description: 'voucher = a discount code is given; gift = the store hands over a gift' }
        benefit: { type: string, nullable: true, description: 'What a voucher gives, e.g. "10% off, up to 50 EGP"' }
        cost: { $ref: '#/components/schemas/LoyaltyPoints' }
        badge: { type: string, nullable: true, description: 'e.g. "Gold members"' }
        canRedeem: { type: boolean }
        reason: { type: string, nullable: true, description: Why it cannot be redeemed now (null when it can) }
    LoyaltyRewardsResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [points, blocker, items]
          additionalProperties: false
          properties:
            points: { $ref: '#/components/schemas/LoyaltyPoints' }
            blocker:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/LoyaltyBlocker' }]
            items:
              type: array
              items: { $ref: '#/components/schemas/LoyaltyReward' }
    LoyaltyRewardResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [points, blocker, reward]
          additionalProperties: false
          properties:
            points: { $ref: '#/components/schemas/LoyaltyPoints' }
            blocker:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/LoyaltyBlocker' }]
            reward: { $ref: '#/components/schemas/LoyaltyReward' }
    LoyaltyRedeemResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [redemption, points]
          additionalProperties: false
          properties:
            redemption:
              type: object
              required: [kind, code, expiresAt, message]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [voucher, gift] }
                code: { type: string, nullable: true, description: The voucher code to use at checkout (null for a gift) }
                expiresAt: { type: string, format: date-time, nullable: true }
                message: { type: string }
            points: { $ref: '#/components/schemas/LoyaltyPoints' }
    LoyaltyEntry:
      type: object
      required: [id, kind, title, detail, points, date, orderId]
      additionalProperties: false
      properties:
        id: { type: string }
        kind: { type: string, enum: [earned, referral, pending, used, expired] }
        title: { type: string }
        detail: { type: string, nullable: true }
        points: { $ref: '#/components/schemas/LoyaltyPoints' }
        date: { type: string, format: date-time }
        orderId: { type: string, nullable: true, description: 'The `Order.id` the points came from (link it)' }
    LoyaltyHistoryResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [items, pagination]
          additionalProperties: false
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LoyaltyEntry' }
            pagination: { $ref: '#/components/schemas/Pagination' }
    LoyaltyReferral:
      type: object
      required: [code, title, message, shareText, points]
      additionalProperties: false
      properties:
        code: { type: string, nullable: true, description: "The customer's code (null = none yet)" }
        title: { type: string }
        message: { type: string, description: How it works }
        shareText: { type: string, nullable: true, description: Ready text to share (null without a code) }
        points:
          description: Points each side gets; null when the store gives none
          nullable: true
          allOf: [{ $ref: '#/components/schemas/LoyaltyPoints' }]
    LoyaltyReferralResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/LoyaltyReferral' }
