name: Verify

# Every push and pull request must pass `npm run verify` before it can be deployed.
# Make this a required status check on the main branch, and make the deploy job depend on it.
on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify (types, lint, rules, contract, tests, build, e2e)
        run: npm run verify
        env:
          CI: 'true'
          # e2e runs against the bundled mock API; the build needs no real backend.
          SC_API_URL: http://127.0.0.1:4010

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  contract-live:
    # Catches the backend drifting from the contract. Informational: it does not block deploys.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:check:live
        env:
          SC_API_URL: ${{ vars.SC_API_URL || 'https://staging-seif.witheldokan.com' }}
